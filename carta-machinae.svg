<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" viewBox="0 0 680 440" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Carta Machinae Intelligentis — a living map of Rohit Yadav's AI engineering journey</title>
<desc>An animated parchment map: a ship sails the expedition route between charted territories, a beacon pulses on the Deep Learning Mountains, and dragons wait in the unknown lands.</desc>
<defs>
  <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f6e7bd"/>
    <stop offset="55%" stop-color="#e9d59b"/>
    <stop offset="100%" stop-color="#d6b977"/>
  </linearGradient>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#cfb06a"/>
    <stop offset="100%" stop-color="#b8923f"/>
  </linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8f6f33"/>
    <stop offset="100%" stop-color="#6e4d1c"/>
  </linearGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#8b6520" stop-opacity="0"/>
    <stop offset="100%" stop-color="#6b4710" stop-opacity="0.45"/>
  </radialGradient>
</defs>

<rect width="680" height="440" rx="8" fill="url(#parch)"/>
<rect x="14" y="52" width="652" height="376" rx="3" fill="#7fa9b8" opacity="0.32"/>

