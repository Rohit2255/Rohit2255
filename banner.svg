<text x="340" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="4" fill="#7090c0">DATA SCIENTIST  ·  MUMBAI  ·  MOUNTAIN SOUL</text>

<text x="400" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="2" fill="#a0b8d8" opacity="0.9">K2 · 8,611m</text>
