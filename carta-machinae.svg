  <text x="358" y="72" text-anchor="middle" font-size="8" font-style="italic" fill="#8b1010">you are here</text>

  <text x="580" y="350" text-anchor="middle" font-size="8.5" font-style="italic" fill="#f6e7bd">hic svnt dracones</text>
