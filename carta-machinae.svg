<path d="M70,362 Q55,352 38,356 L26,366 L26,396 L40,392 Q56,386 70,392 Z" fill="url(#dark)" stroke="#5a3a10" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>

