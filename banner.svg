<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>K2 mountain banner — Rohit Yadav, Data Scientist, Mumbai</title>
<desc>A cinematic night-sky mountain scene showing K2 with stars, snow, and Rohit Yadav's name carved into the base</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#05050f"/>
    <stop offset="60%" stop-color="#0a0a2a"/>
    <stop offset="100%" stop-color="#1a2240"/>
  </linearGradient>
  <linearGradient id="snowL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f0f4ff"/>
    <stop offset="100%" stop-color="#8ca0c0"/>
  </linearGradient>
  <linearGradient id="snowR" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d0d8f0"/>
    <stop offset="100%" stop-color="#5a6a88"/>
  </linearGradient>
  <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c8d8ff" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#0a0a2a" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="680" height="340" fill="url(#sky)"/>

