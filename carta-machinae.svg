  <text x="150" y="416" text-anchor="middle" font-size="8" font-style="italic" fill="#3f6f86">Sea of Unstructured Data</text>
  <text x="572" y="236" text-anchor="middle" font-size="8" font-style="italic" fill="#3f6f86">Uncharted Waters</text>
  <text x="42" y="316" text-anchor="middle" font-size="7.5" font-style="italic" fill="#3f6f86">Bay of</text>
  <text x="42" y="326" text-anchor="middle" font-size="7.5" font-style="italic" fill="#3f6f86">Beginnings</text>
